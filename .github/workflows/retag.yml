name: Recréer les tags et releases

# Exécution unique, à lancer à la main (Actions > Recréer les tags et releases > Run workflow)
# après la réécriture de l'historique. Chaque version est recréée sur son nouveau commit,
# avec les notes de docs/versions/. Par défaut, ne fait qu'afficher le plan.
on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: "true : supprime puis recrée les tags et releases. false : affiche le plan."
        default: "false"

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recréer les versions
        env:
          GH_TOKEN: ${{ github.token }}
          APPLIQUER: ${{ inputs.appliquer }}
        run: |
          set -euo pipefail
          test -f .github/retag-map.txt
          # Vérification de tout le plan avant la moindre suppression.
          while read -r tag sha; do
            [ -n "$tag" ] || continue
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" origin/main
            echo "plan : $tag -> $sha ($(git log -1 --format=%s "$sha"))"
          done < .github/retag-map.txt
          if [ "$APPLIQUER" != "true" ]; then
            echo "Plan seulement (appliquer = false)."
            exit 0
          fi
          # Ordre croissant : la dernière version créée devient la plus récente.
          while read -r tag sha; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes --cleanup-tag || true
            notes="docs/versions/$tag.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" --target "$sha" --title "$tag" --notes-file "$notes"
            else
              gh release create "$tag" --target "$sha" --title "$tag" --generate-notes
            fi
            echo "recréée : $tag"
          done < .github/retag-map.txt
